name: Bug report
description: Report reproducible incorrect behavior in Episode
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Episode. Do not include passwords, private
        addresses, raw evidence, or vulnerability details.
  - type: input
    id: version
    attributes:
      label: Episode version
      description: Shown on the System page and `/health` endpoint.
      placeholder: 0.1.0-beta.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host OS, CPU architecture, Docker and Compose versions.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, private addresses, filenames, and evidence first.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, private addresses, and captured evidence.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true

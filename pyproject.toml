[project]
name = "episode"
version = "0.1.0-beta.2"
description = "A local-first, event-driven incident capture platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["events", "evidence", "surveillance", "self-hosted"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pyftpdlib>=2.0.0",
    "httpx>=0.28.0",
    "lxml>=6.1.0",
]

[project.scripts]
episode = "episode.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
episode = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

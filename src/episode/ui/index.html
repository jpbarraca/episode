<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Episode</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=30">
<link rel="stylesheet" href="design-system.css?v=4">

</head>
<body>
<aside id="sidebar" class="app-sidebar">
  <div class="sidebar-brand">
    <img src="logo.svg" class="logo" alt="">
    <div class="brand-copy">
      <h1>Episode</h1>
      <small>Evidence workspace <span id="app-version" class="app-version" aria-label="Episode version"></span></small>
    </div>
  </div>
  <div class="sidebar-body">
    <nav aria-label="Primary navigation">
      <div class="nav-section">
        <span class="nav-heading">Review</span>
        <a href="#episodes" class="active"><svg class="nav-icon"><use href="icons.svg#episodes"></use></svg>Episodes</a>
        <a href="#activity"><svg class="nav-icon"><use href="icons.svg#activity"></use></svg>Activity</a>
        <a href="#evidence"><svg class="nav-icon"><use href="icons.svg#evidence"></use></svg>Evidence</a>
      </div>
      <div class="nav-section">
        <span class="nav-heading">Configure</span>
        <a href="#devices"><svg class="nav-icon"><use href="icons.svg#devices"></use></svg>Devices</a>
        <a href="#areas"><svg class="nav-icon"><use href="icons.svg#areas"></use></svg>Areas</a>
      </div>
      <div class="nav-section">
        <span class="nav-heading">Operations</span>
        <a href="#system"><svg class="nav-icon"><use href="icons.svg#system"></use></svg>System</a>
      </div>
    </nav>
    <div id="recent-episodes-sidebar"></div>
  </div>
  <div class="sidebar-footer">
    <div id="sidebar-status"></div>
    <button id="theme-toggle" onclick="toggleTheme()"></button>
  </div>
</aside>
<div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden"></div>
<main id="content">
  <div id="mobile-header">
    <button id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Open navigation"><svg class="button-icon"><use href="icons.svg#menu"></use></svg></button>
    <span id="mobile-title">Episode</span>
  </div>
  <div id="policy-banner" class="policy-banner hidden" role="status"></div>
  <div id="view-loading">Loading...</div>
  <div id="view-error" class="hidden"></div>
  <div id="view-content"></div>
</main>

<div id="evidence-carousel" class="carousel-overlay hidden">
  <div class="carousel-backdrop" onclick="closeCarousel()"></div>
  <section class="carousel-dialog" role="dialog" aria-modal="true" aria-labelledby="carousel-title">
    <header class="carousel-header">
      <div><span>Evidence viewer</span><strong id="carousel-title">Evidence</strong></div>
      <div><span id="carousel-counter" class="carousel-counter">0 of 0</span><button class="carousel-close" onclick="closeCarousel()" aria-label="Close slideshow">&times;</button></div>
    </header>
    <div class="carousel-viewport">
      <button id="carousel-prev" class="carousel-prev" onclick="carouselNav(-1)" aria-label="Previous evidence">&#8249;</button>
      <div id="carousel-slide"></div>
      <button id="carousel-next" class="carousel-next" onclick="carouselNav(1)" aria-label="Next evidence">&#8250;</button>
    </div>
    <footer id="carousel-info" class="carousel-info"></footer>
  </section>
</div>

<script type="module" src="app.js?v=44"></script>
</body>
</html>
